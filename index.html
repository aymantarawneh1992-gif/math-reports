<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقارير الرياضيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, reassuring school report for parents
   IDEA: a sealed report envelope that opens with the student number
   PICTURE: progress bars that grow, a level badge, a diagnostic-vs-now comparison
   COLOUR and TYPE: teal 0F5E63 dominant, mint support, amber accent; Noto Kufi Arabic
   LAYOUT: one calm column, phone first */
:root{color-scheme:light dark;--bg:light-dark(#f3faf9,#0b1c1d);--card:light-dark(#fff,#132a2b);--ink:light-dark(#14292a,#e6f2f1);--mut:light-dark(#5b7172,#9fb8b7);--teal:#0F5E63;--teal2:#1B7F86;--mint:light-dark(#E3F4F2,#1a3a3b);--amber:#F2A541;--red:#D9534F;--green:#2E8B57;--purple:#6B4E9B;--line:light-dark(#d9eeeb,#24494a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Noto Kufi Arabic',Tahoma,sans-serif;overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:22px;padding:22px 22px 26px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.3;font-weight:800}
.hero p{margin:4px 0 0;opacity:.92;font-size:14px}
.sym{position:absolute;left:14px;bottom:-8px;font-size:64px;opacity:.13;font-weight:800;direction:ltr;letter-spacing:8px}
.dot{position:absolute;border-radius:50%;background:rgba(242,165,65,.4)}
.lock{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:-14px;position:relative;box-shadow:0 10px 30px rgba(15,94,99,.12)}
.lock h2{margin:0 0 4px;font-size:20px}
.lock .hint{color:var(--mut);font-size:14px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1 1 200px;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:center;letter-spacing:2px}
input:focus{outline:none;border-color:var(--teal2)}
button{font:inherit;font-weight:800;font-size:16px;min-height:48px;padding:0 22px;border:0;border-radius:14px;background:var(--amber);color:#3a2600;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:8px}
.env{width:110px;height:76px;margin:0 auto 14px;display:block}
.hide{display:none}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.chip{background:var(--mint);border-radius:16px;padding:10px 14px;border-inline-start:5px solid var(--teal2)}
.chip b{display:block;font-size:17px}.chip small{color:var(--mut);font-size:13px}
h3{font-size:18px;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h3 i{width:12px;height:12px;border-radius:4px;background:var(--amber);display:inline-block}
.exam{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.exam .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.exam .nm{font-weight:600}.exam .mk{font-weight:800;white-space:nowrap;direction:ltr}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;width:0;border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:20px;background:var(--mint);color:var(--mut)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.box{border-radius:18px;padding:14px;color:#fff;text-align:center}
.box small{display:block;opacity:.95;font-size:13px}.box b{font-size:26px;line-height:1.4}
.beh{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bc small{display:block;color:var(--purple);font-weight:600}
.badge{display:inline-block;margin-top:6px;color:#fff;border-radius:20px;padding:2px 14px;font-weight:800;font-size:14px}
.note{background:var(--card);border-inline-start:6px solid var(--amber);border-radius:16px;padding:14px 16px}
.tips{background:var(--mint);border-radius:16px;padding:12px 16px;font-size:15px}
.tips li{margin:4px 0}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:22px 0 8px}
.sig{font-weight:800;color:var(--teal2);font-size:16px}
@media(prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero"><div class="dot" style="width:120px;height:120px;left:-40px;top:-50px"></div><div class="sym">∑ π √</div>
  <h1>تقرير متابعة الطالب في الرياضيات</h1>
  <p>مدرسة شخبوط بن سلطان للتعليم الثانوي · الفصل الدراسي الأول 2026 / 2027</p></div>

 <div class="lock" id="lock">
  <svg class="env" viewBox="0 0 110 76" aria-hidden="true"><rect x="3" y="10" width="104" height="63" rx="10" fill="#E3F4F2" stroke="#1B7F86" stroke-width="3"/><path d="M5 14 L55 46 L105 14" fill="none" stroke="#1B7F86" stroke-width="3"/><circle cx="55" cy="46" r="12" fill="#F2A541"/><path d="M50 46h10M55 41v10" stroke="#3a2600" stroke-width="2.5" stroke-linecap="round"/></svg>
  <h2 id="lt">تقرير ابنك جاهز</h2>

  <div class="err" id="err"></div>

 else if(typeof v==='string')body='<span class="tag">'+(tot===100?'لم يتقدّم للاختبار التشخيصي':'غائب، اختبار تعويضي')+'</span>';
 else{const p=v/tot*100;body='<div class="bar"><div data-w="'+Math.max(p,3)+'" style="background:'+col(p)+'"></div></div>';
  return '<div class="exam"><div class="top"><span class="nm">'+n+' <small style="color:var(--mut)">'+en+'</small></span><span class="mk" style="color:'+col(p)+'">'+(+v.toFixed(1))+' / '+tot+'</span></div>'+body+'</div>';}
 return '<div class="exam"><div class="top"><span class="nm">'+n+' <small style="color:var(--mut)">'+en+'</small></span></div>'+body+'</div>';
}
function render(s){
 const got=[[s.ae1,30],[s.ae2,20]].filter(x=>typeof x[0]==='number');
 let perf=null;if(got.length)perf=got.reduce((a,x)=>a+x[0],0)/got.reduce((a,x)=>a+x[1],0)*100;
 let lv='—',lc='#888';if(s.sen){lv='وفق خطته الفردية';lc='#6B4E9B'}else if(perf!==null){[lv,lc]=perf>=85?['متقدم','#2E8B57']:perf>=60?['متوسط','#1B7F86']:['يحتاج دعم','#D9534F']}
 let pr='—',pc='#888';if(!s.sen&&perf!==null&&typeof s.diag==='number'&&s.diag>0){const d=perf-s.diag;[pr,pc]=d>=10?['تحسّن ملحوظ ▲','#2E8B57']:d>-10?['ثبات في المستوى','#1B7F86']:['يحتاج متابعة ▼','#D9534F']}
 const beh=[['part','المشاركة الصفية'],['disc','الانضباط والسلوك'],['hw','حل الواجبات']].map(([k,t])=>{const v=(s.beh||{})[k];return '<div class="bc"><small>'+t+'</small><span class="badge" style="background:'+(v?BC[v]||'#6B4E9B':'#aaa')+'">'+(v?esc(v):'—')+'</span></div>'}).join('');
 $('rep').innerHTML=
 '<div class="chips"><div class="chip"><small>اسم الطالب</small><b>'+esc(s.ar)+'</b><small style="direction:ltr;display:block;text-align:right">'+esc(s.en||'')+'</small></div><div class="chip"><small>الصف</small><b>'+(SEC[s.sec]||s.sec)+'</b><small>'+s.sec+'</small></div></div>'+
 '<h3><i></i>النتائج الأكاديمية</h3>'+exam('الاختبار التشخيصي','Diagnostic',s.diag===0?'x':s.diag,100)+exam('الاختبار التقويمي الأول','Assessment Exam 1',s.ae1,30)+exam('الاختبار التقويمي الثاني','Assessment Exam 2',s.ae2,20)+
 '<div class="sum"><div class="box" style="background:linear-gradient(135deg,#0F5E63,#1B7F86)"><small>متوسط الاختبارات التقويمية</small><b>'+(perf===null?'—':Math.round(perf)+'%')+'</b></div><div class="box" style="background:'+lc+'"><small>المستوى الحالي</small><b style="font-size:20px">'+lv+'</b></div><div class="box" style="background:'+pc+'"><small>مقارنة بالاختبار التشخيصي</small><b style="font-size:18px">'+pr+'</b></div></div>'+
 '<h3><i style="background:var(--purple)"></i>الجانب السلوكي</h3><div class="beh">'+beh+'</div>'+
 '<h3><i style="background:var(--teal2)"></i>ملاحظات المعلم</h3><div class="note">'+(s.note?esc(s.note).replace(/\n/g,'<br>'):'<span style="color:var(--mut)">سيتم إضافة ملاحظات المعلم قريباً.</span>')+'</div>'+
 '<h3><i style="background:var(--green)"></i>كيف تدعم ابنك في البيت؟</h3><ul class="tips"><li>متابعة دفتر الواجبات يومياً والتأكد من حلّ الواجب قبل الحصة.</li><li>مراجعة درس اليوم 15 دقيقة على الأقل.</li><li>التواصل مع المعلم عند ملاحظة أي صعوبة.</li><li>الحرص على النوم المبكر والحضور المنتظم.</li></ul>'+
 '<p class="foot">آخر تحديث: '+DATA.__updated+'</p>';
 $('lock').classList.add('hide');$('rep').classList.remove('hide');
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.bar>div').forEach(b=>b.style.width=b.dataset.w+'%'),80));
}
$('f').addEventListener('submit',async e=>{e.preventDefault();$('err').textContent='';
 try{render(await open($('pw').value))}catch(x){$('err').textContent='الرقم غير صحيح، تأكد من رقم الطالب وحاول مرة أخرى.'}});
}
</script>
</body>
</html>
